<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Temperature Tracker</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for Leaflet Map */
        #map {
            height: 80vh; /* Responsive height */
            width: 100%;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
        }
        .leaflet-container {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc; /* Tailwind gray-50 */
        }
        .info-box {
            padding: 10px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
    </style>
    <!-- Load Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""/>

    <!-- --- GOOGLE ADS INTEGRATION START --- -->
    <!-- 1. Initialize the global array for ad calls. Client ID: pub-3999150581617736 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-3999150581617736"
     crossorigin="anonymous"></script>
    <!-- --- GOOGLE ADS INTEGRATION END --- -->
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8 font-sans">

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-800 tracking-tight mb-2">
                Global Temperature Tracker Map
            </h1>
            <!-- Updated description -->
            <p class="text-gray-600 text-lg">Click anywhere or use the search bar to retrieve current weather conditions and a Gemini insight.</p>
        </header>

        <!-- Search Bar -->
        <div class="mb-6 p-4 bg-white rounded-xl shadow-lg border border-gray-200">
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                <input type="text" id="cityInput" placeholder="Enter city name (e.g., Paris, Tokyo)"
                       class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm transition"
                       onkeydown="if(event.key === 'Enter') document.getElementById('searchCityBtn').click()">
                <button id="searchCityBtn"
                        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Search City
                </button>
            </div>
        </div>
        
        <!-- --- AD BANNER SLOT START --- -->
        <!-- Ad Unit configured with both client and slot IDs -->
        <div class="text-center mb-6">
            <p class="text-sm text-gray-500 mb-2">Advertisement</p>
            <ins class="adsbygoogle"
                 style="display:block; text-align:center;"
                 data-ad-client="pub-3999150581617736"
                 data-ad-slot="8788572308"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                // This pushes the ad to be rendered by the script loaded in the head.
                try {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                } catch (e) {
                    console.error("AdSense integration error:", e);
                }
            </script>
        </div>
        <!-- --- AD BANNER SLOT END --- -->

        <!-- Status Message -->
        <div class="mb-6 p-4 bg-white rounded-xl shadow-lg border border-gray-200 text-center">
            <div id="statusMessage" class="text-md font-semibold text-green-600 transition-colors">
                Map is ready. Click on any location or search for a city to fetch keyless weather data.
            </div>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-[9999]">
            <div class="p-6 bg-white rounded-xl shadow-2xl flex items-center space-x-3">
                <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-lg font-medium text-gray-700">Fetching location and weather data...</span>
            </div>
        </div>

        <!-- Notification Message Box -->
        <div id="notificationBox" class="info-box fixed bottom-4 right-4 z-[9999] hidden transition-opacity duration-300 opacity-0 max-w-xs">
            <p id="notificationText" class="text-gray-700 text-sm"></p>
        </div>

    </div>

    <!-- Load Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""></script>

    <script>
        // Global variables for Firebase setup (required even if not used for persistence here)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let map;
        let currentMarker = null;
        
        const loadingIndicator = document.getElementById('loadingIndicator');
        const notificationBox = document.getElementById('notificationBox');
        const notificationText = document.getElementById('notificationText');
        const cityInput = document.getElementById('cityInput');
        const searchCityBtn = document.getElementById('searchCityBtn');

        // WMO Weather Codes (Open-Meteo) mapping for human-readable description
        const WMO_CODES = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog',
            48: 'Depositing rime fog', 51: 'Light drizzle', 53: 'Moderate drizzle', 55: 'Dense drizzle',
            61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain', 71: 'Slight snow fall',
            73: 'Moderate snow fall', 75: 'Heavy snow fall', 80: 'Slight rain showers',
            81: 'Moderate rain showers', 82: 'Violent rain showers', 95: 'Thunderstorm',
            96: 'Thunderstorm with slight hail', 99: 'Thunderstorm with heavy hail'
        };
        
        // Helper function to convert wind direction degrees to cardinal points
        function degreesToCardinal(deg) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round((deg % 360) / 45);
            return directions[index % 8];
        }

        // --- Utility Functions ---

        /**
         * Displays a temporary notification message.
         * @param {string} message The message to display.
         * @param {string} type 'success', 'error', or 'info'
         */
        function showNotification(message, type = 'info') {
            let bgColor = 'bg-blue-100';
            let textColor = 'text-blue-800';

            if (type === 'error') {
                bgColor = 'bg-red-100';
                textColor = 'text-red-800';
            } else if (type === 'success') {
                bgColor = 'bg-green-100';
                textColor = 'text-green-800';
            } else if (type === 'llm') {
                bgColor = 'bg-purple-100';
                textColor = 'text-purple-800';
            }


            notificationBox.className = `info-box fixed bottom-4 right-4 z-[9999] transition-opacity duration-300 opacity-0 max-w-xs ${bgColor}`;
            notificationText.className = `${textColor} text-sm font-medium`;
            notificationText.innerHTML = message; // Use innerHTML to allow for bold/formatting

            // Show and fade out
            notificationBox.classList.remove('hidden', 'opacity-0');
            notificationBox.classList.add('opacity-100');

            setTimeout(() => {
                notificationBox.classList.remove('opacity-100');
                notificationBox.classList.add('opacity-0');
                setTimeout(() => {
                    notificationBox.classList.add('hidden');
                }, 300); // Wait for fade-out
            }, 8000); // Increased visibility time for LLM response
        }


        /**
         * Initializes the Leaflet map and event listeners.
         */
        function initMap() {
            map = L.map('map').setView([20, 0], 3);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            setTimeout(() => {
                map.invalidateSize();
            }, 100); 

            map.on('click', onMapClick);
            searchCityBtn.addEventListener('click', geocodeAndSearch);
        }


        /**
         * Handles map clicks, extracting coordinates and triggering the fetch.
         * @param {object} e Leaflet event object.
         */
        function onMapClick(e) {
            const lat = e.latlng.lat.toFixed(4);
            const lon = e.latlng.lng.toFixed(4);

            loadingIndicator.classList.remove('hidden');

            // Remove previous marker
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            // Start the fetching process
            fetchDataForLocation(lat, lon);
        }

        /**
         * Uses Nominatim to convert a city name to coordinates, pans the map, and fetches weather.
         */
        async function geocodeAndSearch() {
            const city = cityInput.value.trim();
            if (!city) {
                showNotification("Please enter a city name to search.", "info");
                return;
            }

            loadingIndicator.classList.remove('hidden');
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            const searchUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`;
            
            try {
                const response = await fetch(searchUrl);
                if (!response.ok) {
                    throw new Error("Geocoding API Error");
                }
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat).toFixed(4);
                    const lon = parseFloat(data[0].lon).toFixed(4);
                    const displayName = data[0].display_name;

                    // Pan the map to the new location and set a good zoom level
                    map.setView([lat, lon], 10);
                    
                    // Fetch data using the new coordinates
                    await fetchDataForLocation(lat, lon, displayName);
                    
                } else {
                    showNotification(`Location "${city}" not found. Please try a different name.`, "error");
                    loadingIndicator.classList.add('hidden');
                }

            } catch (error) {
                console.error("Geocoding failure:", error);
                showNotification(`Could not process search request: ${error.message}`, "error");
                loadingIndicator.classList.add('hidden');
            }
        }


        /**
         * Fetches weather data using the Open-Meteo API (keyless).
         */
        async function fetchOpenMeteoWeather(lat, lon) {
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature,weathercode,snow_depth,wind_speed_10m,wind_direction_10m,relative_humidity_2m&temperature_unit=celsius&wind_speed_unit=kmh&forecast_days=1`;
            
            const response = await fetch(weatherUrl);

            if (!response.ok) {
                throw new Error(`Open-Meteo API Error: ${response.statusText}`);
            }
            return response.json();
        }

        /**
         * Fetches location name using Nominatim (OpenStreetMap reverse geocoding).
         */
        async function fetchLocationName(lat, lon) {
            const nominatimUrl = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
            
            try {
                const response = await fetch(nominatimUrl);
                if (!response.ok) {
                    throw new Error("Nominatim API Error");
                }
                const data = await response.json();
                
                // Prioritize city, then town, then village, otherwise use the full display name
                if (data.address) {
                    return data.address.city || data.address.town || data.address.village || data.display_name.split(',').slice(0, 3).join(', ');
                }
                return `Unknown Location (${lat}, ${lon})`;

            } catch (error) {
                console.warn("Failed to retrieve location name from Nominatim:", error);
                return `Coordinates (${lat}, ${lon})`;
            }
        }
        
        /**
         * Calls the Gemini API to get a fun fact or travel tip based on weather data.
         */
        async function fetchGeminiInsight(location, temperature, description) {
            console.log("Gemini Insight: Starting API call...");
            const systemPrompt = "You are a witty and helpful virtual travel guide. Your task is to provide a single, concise, and engaging travel insight, fun fact, or safety tip relevant to the current location and weather conditions. The response must be a single short paragraph, no more than 3 sentences.";
            const userQuery = `The current weather in ${location} is ${temperature} and the sky is ${description}. What is a relevant travel insight or fun fact?`;
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                tools: [{ "google_search": {} }], // Use search grounding for up-to-date facts
            };

            const MAX_RETRIES = 5;
            for (let i = 0; i < MAX_RETRIES; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        console.log(`Gemini Insight: Attempt ${i + 1} failed with status ${response.status}.`);
                        if (response.status === 429 && i < MAX_RETRIES - 1) {
                            // Too Many Requests (Rate Limit) -> Retry with exponential backoff
                            const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue;
                        }
                        throw new Error(`API error: ${response.statusText}`);
                    }

                    const result = await response.json();
                    console.log("Gemini Insight: Successful response received.", result);
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        console.log("Gemini Insight: Text extracted successfully.");
                        return `**✨ Gemini Insight:** ${text}`;
                    } else {
                        console.error("Gemini Insight: Failed to extract text from candidate.", result);
                        throw new Error("Failed to parse LLM response (no text content).");
                    }
                } catch (error) {
                    console.error(`Gemini Insight: Error during fetch or processing in attempt ${i + 1}:`, error);
                    if (i === MAX_RETRIES - 1) {
                        throw error;
                    }
                    // Continue loop for retry
                }
            }
            throw new Error("Maximum retries reached for Gemini API call.");
        }


        /**
         * Orchestrates the two fetch calls and handles failures gracefully.
         */
        async function fetchDataForLocation(lat, lon, preFetchedLocationName = null) {
            let locationName = preFetchedLocationName || `Coordinates (${lat}, ${lon})`;
            let weatherData = null;
            let finalDescription = 'N/A';
            let finalTemperature = 'N/A';
            let finalSnowDepth = 'N/A'; 
            let finalElevation = 'N/A';
            let finalWindSpeed = 'N/A'; 
            let finalWindDirection = 'N/A'; 
            let finalHumidity = 'N/A'; 


            try {
                // Fetch location name if not already provided (only for map clicks)
                if (!preFetchedLocationName) {
                    locationName = await fetchLocationName(lat, lon);
                }

                // Fetch weather data (critical for the app)
                weatherData = await fetchOpenMeteoWeather(lat, lon);
                
                // Process successful weather data
                if (weatherData.current) { 
                    const current = weatherData.current;
                    
                    // Core Data
                    finalTemperature = (typeof current.temperature === 'number' ? current.temperature.toFixed(1) : current.temperature) + ' °C';
                    finalDescription = WMO_CODES[current.weathercode] || 'Unknown condition';
                    
                    // Snow Depth
                    finalSnowDepth = (typeof current.snow_depth === 'number' && current.snow_depth > 0.01) ? current.snow_depth.toFixed(2) + ' m' : '0.00 m';
                    
                    // Wind Data
                    if (typeof current.wind_speed_10m === 'number') {
                        finalWindSpeed = current.wind_speed_10m.toFixed(1) + ' km/h';
                    }
                    if (typeof current.wind_direction_10m === 'number') {
                        const cardinal = degreesToCardinal(current.wind_direction_10m);
                        finalWindDirection = `${cardinal} (${current.wind_direction_10m.toFixed(0)}°)`
                    }
                    
                    // Humidity Data
                    if (typeof current.relative_humidity_2m === 'number') {
                        finalHumidity = current.relative_humidity_2m.toFixed(0) + ' %';
                    }
                }
                
                // Extract Elevation (available at the root level of the Open-Meteo response)
                if (typeof weatherData.elevation === 'number') {
                    finalElevation = weatherData.elevation.toFixed(0) + ' m';
                }

                showNotification(`Weather for ${locationName} retrieved successfully.`, "success");

            } catch (error) {
                // Handle critical weather API error
                console.error("Critical Fetch error:", error);
                showNotification(`Weather API failed: ${error.message}. Showing placeholder data.`, "error");

            } finally {
                loadingIndicator.classList.add('hidden');
                
                // Ensure we display the marker with the best data available
                updateMapAndDisplayData(
                    finalTemperature, finalDescription, finalSnowDepth, finalElevation, 
                    finalWindSpeed, finalWindDirection, finalHumidity, 
                    locationName, lat, lon
                );
            }
        }
        
        /**
         * Updates the map marker popup with the processed data and attaches the button listeners.
         */
        function updateMapAndDisplayData(temperature, description, snowDepth, elevation, windSpeed, windDirection, humidity, locationName, lat, lon) {
            
            // 1. Construct Popup Content (Using w-full inside the popup)
            const popupContent = `
                <div class="font-sans text-gray-800 w-full"> 
                    <h3 class="text-xl font-bold text-blue-700 mb-1">${locationName}</h3>
                    <div class="border-b border-gray-200 pb-2 mb-2">
                        <p class="text-4xl font-extrabold">${temperature}</p>
                        <p class="capitalize text-md text-gray-600 mb-2">${description}</p>
                        
                        <!-- Core Weather Metrics -->
                        <div class="space-y-1 mt-3">
                            <!-- Wind Information -->
                            <div class="flex justify-between items-center text-sm font-medium text-gray-700 p-2 bg-blue-50 rounded-lg">
                                <span>Wind:</span>
                                <span class="font-semibold text-blue-700">${windSpeed} (${windDirection})</span>
                            </div>

                            <!-- Humidity Information -->
                            <div class="flex justify-between items-center text-sm font-medium text-gray-700 p-2 bg-blue-50 rounded-lg">
                                <span>Humidity:</span>
                                <span class="font-semibold text-blue-700">${humidity}</span>
                            </div>
                            
                            <!-- Snow Depth Information -->
                            <div class="flex justify-between items-center text-sm font-medium text-gray-700 p-2 bg-gray-100 rounded-lg">
                                <span>Snow Depth:</span>
                                <span class="font-semibold text-gray-600">${snowDepth}</span>
                            </div>
                            
                            <!-- Elevation Information -->
                            <div class="flex justify-between items-center text-sm font-medium text-gray-700 p-2 bg-gray-100 rounded-lg">
                                <span>Elevation (AMSL):</span>
                                <span class="font-semibold text-gray-600">${elevation}</span>
                            </div>
                        </div>

                        <p class="mt-2 text-xs text-gray-500">Coordinates: (${lat}, ${lon})</p>
                    </div>
                    
                    <!-- Gemini Insight Button (Existing) -->
                    <button 
                        id="travelTipBtn" 
                        data-location="${locationName.replace(/"/g, '')}" 
                        data-weather="${description.replace(/"/g, '')}" 
                        data-temp="${temperature.replace(' °C', '')}" 
                        class="w-full mt-3 px-3 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold rounded-lg transition shadow-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50"
                    >
                        ✨ Get Weather Insight
                    </button>
                    <p class="text-xs text-gray-400 italic mt-2">Data via Open-Meteo & Nominatim.</p>
                </div>
            `;

            // 2. Create a new marker and bind event listener for the buttons
            currentMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup(popupContent, { maxWidth: 350 });

            currentMarker.on('popupopen', function() {
                const travelTipBtn = document.getElementById('travelTipBtn');

                // Listener for Gemini Insight Button
                if (travelTipBtn) {
                    travelTipBtn.addEventListener('click', () => {
                        console.log("Insight button clicked. Starting LLM process...");
                        const loc = travelTipBtn.getAttribute('data-location');
                        const weather = travelTipBtn.getAttribute('data-weather');
                        const temp = travelTipBtn.getAttribute('data-temp');
                        
                        // Temporarily disable button and show loading
                        travelTipBtn.disabled = true;
                        travelTipBtn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
                        travelTipBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
                        travelTipBtn.textContent = 'Generating Insight...';
                        
                        fetchGeminiInsight(loc, temp, weather)
                            .then(insight => {
                                console.log("Insight fetched successfully.");
                                // Display LLM result in a specific notification box
                                showNotification(insight, 'llm'); 
                            })
                            .catch(error => {
                                console.error("LLM Insight Fetch failed:", error);
                                showNotification('Failed to get insight. Try again later.', 'error');
                            })
                            .finally(() => {
                                console.log("LLM process finished. Re-enabling button.");
                                // Re-enable button
                                travelTipBtn.disabled = false;
                                travelTipBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                                travelTipBtn.classList.add('bg-purple-600', 'hover:bg-purple-700');
                                travelTipBtn.textContent = '✨ Get Weather Insight';
                            });
                    });
                }
            }).openPopup();
        }

        // Initialize the map once the DOM content is fully loaded
        document.addEventListener('DOMContentLoaded', initMap);

    </script>
</body>
</html>
